<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" role="img" aria-label="Starry Night banner for Malak" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#08163d"/>
      <stop offset="0.6" stop-color="#1c3a7a"/>
      <stop offset="1" stop-color="#2f66a8"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#ffe98a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffe98a" stop-opacity="0"/>
    </radialGradient>
    <style>
      .flow { fill: none; stroke-linecap: round; stroke-dasharray: 60 40; animation: drift 6s linear infinite; }
      .flow.slow { animation-duration: 10s; }
      .flow.rev { animation-direction: reverse; }
      @keyframes drift { to { stroke-dashoffset: -200; } }
      .swirl { fill: none; stroke-linecap: round; stroke-dasharray: 700; stroke-dashoffset: 700; animation: draw 6s ease-in-out infinite alternate; }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      .tree { transform-origin: 85px 320px; animation: sway 5s ease-in-out infinite alternate; }
      @keyframes sway { from { transform: rotate(-1.2deg); } to { transform: rotate(1.2deg); } }
      .title { animation: rise 2s ease-out both; }
      @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
      .win { animation: flick 3s ease-in-out infinite; }
      @keyframes flick { 50% { opacity: 0.45; } }
    </style>
  </defs>

  <rect width="1000" height="320" fill="url(#sky)"/>

  <!-- flowing wind streaks -->
  <path class="flow" d="M0 70 C150 30 250 110 400 70 S650 30 800 80 S950 60 1000 50" stroke="#7fb4e6" stroke-width="5" opacity="0.55"/>
  <path class="flow slow rev" d="M0 130 C140 90 260 170 420 125 S660 90 820 140 S960 120 1000 110" stroke="#a9d0f5" stroke-width="4" opacity="0.45"/>
  <path class="flow slow" d="M0 190 C160 150 280 230 440 185 S680 150 840 200 S970 180 1000 170" stroke="#4f86c6" stroke-width="6" opacity="0.5"/>

  <!-- big swirls -->
  <g stroke-width="6">
    <path class="swirl" d="M560 130 C600 60 700 70 710 140 C720 205 635 215 620 160 C610 120 655 105 670 138 C678 158 655 170 645 156" stroke="#f3d36b"/>
    <path class="swirl" style="animation-delay:1s" d="M770 150 C800 100 880 110 885 165 C890 215 820 222 808 178 C800 148 838 138 848 164" stroke="#8fc0ef"/>
    <path class="swirl" style="animation-delay:2s" d="M420 105 C450 70 510 80 513 120 C516 158 466 162 458 130 C453 108 485 102 490 122" stroke="#cfe6ff"/>
  </g>

  <!-- stars -->
  <g fill="#ffe98a">
    <g transform="translate(330 60)">
      <circle r="18" fill="url(#glow)"><animate attributeName="r" values="14;24;14" dur="3s" repeatCount="indefinite"/></circle>
      <circle r="4.5"><animate attributeName="opacity" values="1;0.5;1" dur="3s" repeatCount="indefinite"/></circle>
    </g>
    <g transform="translate(560 40)">
      <circle r="18" fill="url(#glow)"><animate attributeName="r" values="12;22;12" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle r="4"><animate attributeName="opacity" values="0.6;1;0.6" dur="2.4s" repeatCount="indefinite"/></circle>
    </g>
    <g transform="translate(740 60)">
      <circle r="18" fill="url(#glow)"><animate attributeName="r" values="14;26;14" dur="3.6s" repeatCount="indefinite"/></circle>
      <circle r="5"><animate attributeName="opacity" values="1;0.5;1" dur="3.6s" repeatCount="indefinite"/></circle>
    </g>
    <g transform="translate(930 150)">
      <circle r="16" fill="url(#glow)"><animate attributeName="r" values="10;20;10" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle r="4"><animate attributeName="opacity" values="0.5;1;0.5" dur="2.8s" repeatCount="indefinite"/></circle>
    </g>
    <g transform="translate(250 150)">
      <circle r="16" fill="url(#glow)"><animate attributeName="r" values="10;20;10" dur="3.2s" repeatCount="indefinite"/></circle>
      <circle r="3.5"><animate attributeName="opacity" values="0.5;1;0.5" dur="3.2s" repeatCount="indefinite"/></circle>
    </g>
  </g>

  <!-- moon -->
  <circle cx="905" cy="62" r="58" fill="url(#glow)"><animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/></circle>
  <path d="M912 28 A34 34 0 1 0 912 96 A25 34 0 1 1 912 28 Z" fill="#f6d55c"/>

  <!-- hills and village -->
  <path d="M0 320 L0 268 C120 240 220 270 340 255 C480 238 600 275 740 258 C860 244 940 262 1000 252 L1000 320 Z" fill="#0f2447"/>
  <path d="M0 320 L0 292 C160 272 320 300 500 286 C700 270 860 300 1000 284 L1000 320 Z" fill="#0a1830"/>
  <g fill="#122b52">
    <rect x="560" y="262" width="26" height="20"/><path d="M556 262 L573 248 L590 262 Z"/>
    <rect x="620" y="268" width="22" height="16"/><path d="M616 268 L631 256 L646 268 Z"/>
    <rect x="690" y="260" width="28" height="22"/><path d="M686 260 L704 245 L722 260 Z"/>
    <rect x="770" y="266" width="22" height="16"/><path d="M766 266 L781 254 L796 266 Z"/>
  </g>
  <g fill="#ffd966">
    <rect class="win" x="568" y="268" width="6" height="7"/>
    <rect class="win" style="animation-delay:.8s" x="626" y="273" width="5" height="6"/>
    <rect class="win" style="animation-delay:1.6s" x="699" y="266" width="6" height="8"/>
    <rect class="win" style="animation-delay:2.2s" x="776" y="271" width="5" height="6"/>
  </g>

  <!-- cypress -->
  <g class="tree">
    <path d="M85 320 C60 270 48 200 70 120 C76 90 82 60 88 28 C96 62 104 92 108 125 C128 205 112 275 100 320 Z" fill="#07140f"/>
    <path d="M88 40 C84 100 72 190 80 300" stroke="#16372a" stroke-width="3" fill="none" opacity="0.7"/>
  </g>

  <!-- title -->
  <g class="title">
    <text x="170" y="150" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="64" fill="#f6d55c">Malak</text>
    <text x="172" y="188" font-family="Georgia, serif" font-size="20" fill="#cfe3ff">@malakaladen · Student · Building things, one star at a time</text>
  </g>
</svg>
